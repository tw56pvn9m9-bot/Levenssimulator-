<meta name="mobile-web-app-capable" content="yes">

<title>Levenssimulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8; --card:#fffdf9; --ink:#22251f; --mute:#7a7a70; --line:#e6e0d4;
  --acc:#2f6f5e; --acc2:#e0794a; --good:#3d9a5f; --mid:#e2a93b; --bad:#d4553f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:none}
#app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}

/* header */
.head{padding:14px 16px 8px;display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;border-radius:18px;background:var(--card);border:2px solid var(--line);
  display:grid;place-items:center;font-size:34px;flex:none}
.who{flex:1;min-width:0}
.who h1{margin:0;font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{text-align:right;flex:none}
.money b{display:block;font-size:18px;font-weight:900}
.money span{font-size:12px;color:var(--mute)}
.neg{color:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:4px 16px 10px}
.stat{font-size:12px;font-weight:700}
.stat .row{display:flex;justify-content:space-between;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .4s,background .4s}

/* log */
.log{flex:1;overflow-y:auto;margin:0 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 14px 14px}
.yr{margin-top:12px}
.yr h3{margin:0 0 4px;font-size:13px;font-weight:900;color:var(--acc);letter-spacing:.3px}
.yr p{margin:3px 0;font-size:14.5px;line-height:1.4}
.yr p .mo{display:inline-block;width:22px;font-size:12px}
.yr p.good{color:var(--good)} .yr p.world{color:#2d5fa6;font-weight:700} .yr p.bad{color:var(--bad)} .yr p.big{font-weight:800}

/* bottom */
.bottom{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.energy{display:flex;justify-content:center;gap:6px;font-size:12px;color:var(--mute);align-items:center;margin-bottom:8px}
.energy i{width:10px;height:10px;border-radius:50%;background:var(--acc2)}
.energy i.off{background:var(--line)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 2px;font-size:11px;font-weight:800;color:var(--ink)}
.tab span{display:block;font-size:22px;margin-bottom:2px}
.age{width:100%;background:var(--acc);color:#fff;border-radius:16px;padding:15px;font-size:18px;font-weight:900;box-shadow:0 4px 0 #1f4d41}
.age:active{transform:translateY(2px);box-shadow:0 2px 0 #1f4d41}

/* sheet + modal */
.veil{position:fixed;inset:0;background:rgba(30,30,25,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:82dvh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
.modalwrap{align-items:center;padding:16px}
.modal{background:var(--card);width:100%;max-width:440px;border-radius:24px;padding:22px;max-height:88dvh;overflow-y:auto;animation:pop .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.sheet h2,.modal h2{margin:0 0 4px;font-size:20px;font-weight:900}
.modal .emoji{font-size:44px;text-align:center}
.modal p{font-size:15px;line-height:1.45;margin:8px 0 14px}
.hint{font-size:13px;color:var(--mute);margin:0 0 12px}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:15px;font-weight:700;color:var(--ink)}
.act .ic{font-size:24px;width:30px;text-align:center}
.act small{display:block;font-weight:600;color:var(--mute);font-size:12.5px}
.act:disabled{opacity:.45}
.choice{width:100%;background:var(--acc);color:#fff;border-radius:14px;padding:13px;font-size:15.5px;font-weight:800;margin-top:8px}
.choice.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.choice:disabled{opacity:.4}
.close{float:right;background:none;font-size:22px;color:var(--mute);padding:0 4px}
.sec{font-size:12px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 8px}

/* start */
.start{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px}
.start h1{font-size:34px;font-weight:900;margin:0 0 4px;line-height:1.05}
.start .lead{color:var(--mute);margin:0 0 24px}
.field{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--card);margin-bottom:10px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.gender button{padding:12px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:15px;font-weight:800;color:var(--ink)}
.gender button.sel{border-color:var(--acc);background:#e5efe9}
.start{overflow-y:auto;justify-content:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:12px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips button{padding:9px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:14px;font-weight:800;color:var(--ink)}
.chips button.sel{border-color:var(--acc);background:#e5efe9}
.sl{margin-bottom:6px}.sl label{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.sl input{width:100%;accent-color:var(--acc)}
select.field{appearance:auto}
.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;
  font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.on{opacity:1}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.sum div{background:var(--bg);border-radius:12px;padding:10px;font-size:12px;color:var(--mute);font-weight:700}
.sum b{display:block;font-size:16px;color:var(--ink)}
</style>
</head>

function tick(){

  S.q=(S.q||0)+1; S.energie=EMAX;
  gradeTick(S.school); gradeTick(S.student);
  if(S.age>=8&&S.age<18) S.geld+=[0,60,300,2000][S.rijk||0];
  if(S.sport&&!inJail){const sp=S.sport; if(S.age>=18&&sp.rank<4) S.geld-=60;
    if(sp.rank>=4&&!sp.oud) S.geld+=SPAY[sp.rank]*SPORTS[sp.k].f*(.6+sp.skill/150)*(sp.bonus||1)*.72/4;}
  // aandelen
  const crash=chance(.025);
  if(crash&&stockVal()>500) log('📉 Beurscrash! Alle aandelen gaan hard onderuit.','bad big');
  for(const k in S.sx){const c=S.sx[k],v=c.vol/2; c.p*=Math.exp(c.dr/4-v*v/2+v*gauss())*(crash?Math.exp(-R(15,35)/100):1);
    if(S.shares[k]>0&&c.div){const d=S.shares[k]*c.p*c.div/4; S.geld+=d; S.divY+=d;}}
  if(!inJail){
    if(S.student) S.geld-=S.student.pt?C().study/9:(S.rijk>=2?0:C().study/4);
    if(S.job) S.geld+=S.job.s*.72/4;
    if(S.pol&&S.pol.rank>=1) S.geld+=(POL[S.pol.rank].s*C().sf)*.72/4;
    if(S.ero){const e=S.ero; if(e.s) S.geld+=e.s*(1+e.rep/100)*.72/4; else if(e.k==='fans'||!e.k) S.geld+=(e.fans||0)*R(90,180)/100*.72;}
    if(S.retired) S.geld+=(C().aow+S.lastSalary*.3)/4;
    if(S.age>=18&&!S.student){
      S.geld-=livingCost()/4;
      if(!S.job&&!S.retired&&!S.ero&&!(S.pol&&S.pol.rank>=1)&&!(S.sport&&S.sport.rank>=4&&!S.sport.oud)) S.geld+=C().uit/4;
    }
    for(const k in S.sm) if(S.sm[k]>=1000) S.geld+=S.sm[k]*PLAT[k].rev/4;
  }
  if(S.age>=18) S.pets.forEach(p=>S.geld-=PETS[p.soort].c/4);

  for(const k in S.cx){const c=S.cx[k],v=c.vol/2; c.p*=Math.exp(c.dr/4-v*v/2+v*gauss());
    if(c.rug&&chance(c.rug/4)){c.p*=.03; if(S.wallet[k]>0) log(`🧻 Rug pull! ${c.n} is in één nacht 97% minder waard.`,'bad');}
    c.p=Math.max(c.p,1e-9);}
  if(S.q>=4){S.q=0; ageUp();}
  if(S.alive&&S.age>=5&&chance(.25)) randomEvent();
  for(const k in st) st[k]=clamp(st[k]);
  save(); render();
}

function schoolYear(){
  const sc=S.school, st=S.st;
  sc.clubs.forEach(c=>{ if(c==='toneel'){st.uiterlijk+=1;S.fame=Math.min(100,S.fame+1)} if(c==='band'){st.geluk+=2;S.fame=Math.min(100,S.fame+1)}
    if(c==='raad'||c==='krant') st.slimheid+=1; if(c==='schaak') st.slimheid+=2; });
  if(sc.niv==='basis'){ sc.klas++; if(sc.klas>8) schooladvies(); return; }
  const N=NIV[sc.niv].n;
  log(`📋 Rapport ${schoolLabel()}: gemiddeld een ${fmtC(sc.cijfer)}.`, sc.cijfer>=5.5?'good':'bad');
  if(sc.klas>=N){
    if(chance(Math.max(.08,Math.min(.97,(sc.cijfer-4.2)/2.6)))){
      S.dips.push({lvl:1,r:sc.niv}); st.geluk+=12; log(`🎓 Geslaagd! Je hebt je ${nivN(sc.niv)}-diploma. ${C().f}`,'good big');
      const niv=sc.niv, c=sc.cijfer; S.school=null; nextStep(niv,c);
    }else{
      st.geluk-=10; log(`Gezakt voor je ${nivN(sc.niv)}-examen. 😞`,'bad big');
      queue({e:'📝',t:'Gezakt',x:'Je bent gezakt voor je eindexamen. Wat nu?',c:[
        {l:'Het jaar overdoen',f:()=>{sc.cijfer=Math.max(sc.cijfer,6);return 'Je doet het examenjaar over.'}},
        {l:'Stoppen zonder diploma',alt:1,f:()=>{S.school=null;return 'Je gaat van school af zonder diploma.'}}]});
    }
    return;
  }
  if(sc.cijfer<5.5&&chance(.6)){ sc.zit++;
    if(sc.zit>=2&&sc.niv!=='vmbo'){const lager=sc.niv==='vwo'?'havo':'vmbo';sc.niv=lager;sc.klas=Math.min(sc.klas,NIV[lager].n-1);sc.zit=0;sc.cijfer+=1;
      log(`⬇️ Je stroomt af naar het ${lager}.`,'bad big');}
    else log(`😬 Je blijft zitten in ${schoolLabel()}.`,'bad');
    st.geluk-=6; return; }
  sc.klas++;
}
function schooladvies(){
  const sc=S.school, score=S.st.slimheid*.6+sc.cijfer*6;
  const adv=score<58?'vmbo':score<74?'havo':'vwo', hoger=adv==='vmbo'?'havo':adv==='havo'?'vwo':null;
  log(`✉️ Je schooladvies voor groep 8: ${adv}.`,'big');
  const start=niv=>()=>{S.school={niv,klas:1,cijfer:sc.cijfer-(niv!==adv?.7:0),clubs:sc.clubs,zit:0};return `Je begint op het ${niv}. Nieuwe school, nieuwe klasgenoten!`};
  log(start(adv)());
  const c=[{l:`Prima, ${adv} it is`,f:()=>null}];
  if(hoger) c.push({l:`Toch ${hoger} proberen`,alt:1,f:start(hoger)});
  queue({e:'🏫',t:'Schooladvies',x:`Op basis van je cijfers en slimheid krijg je het advies <b>${adv}</b>.`,c});
}
function nextStep(niv,cijfer){ // na het middelbare-schooldiploma
  const c=[];
  if(niv==='vmbo'){ c.push({l:'🛠️ Naar het mbo',f:()=>{setTimeout(()=>pickRicht(2),250);return null}});
    if(cijfer>=7) c.push({l:'⬆️ Doorstromen naar havo 4',f:()=>{S.school={niv:'havo',klas:4,cijfer:cijfer-.5,clubs:[],zit:0};return 'Je stroomt door naar havo 4.'}}); }
  if(niv==='havo'){ c.push({l:'🏫 Naar het hbo',f:()=>{setTimeout(()=>pickRicht(3),250);return null}});
    c.push({l:'🛠️ Naar het mbo',alt:1,f:()=>{setTimeout(()=>pickRicht(2),250);return null}});
    if(cijfer>=7) c.push({l:'⬆️ Doorstromen naar vwo 5',alt:1,f:()=>{S.school={niv:'vwo',klas:5,cijfer:cijfer-.5,clubs:[],zit:0};return 'Je stroomt door naar vwo 5.'}}); }
  if(niv==='vwo'){ c.push({l:'🎓 Naar de universiteit',f:()=>{setTimeout(()=>pickRicht(4),250);return null}});
    c.push({l:'🏫 Naar het hbo',alt:1,f:()=>{setTimeout(()=>pickRicht(3),250);return null}}); }
  c.push({l:'💼 Gaan werken',alt:1,f:()=>{setTimeout(applyJob,250);return 'Je besluit te gaan werken.'}});
  if(niv!=='vmbo') c.push({l:'🎒 Tussenjaar: backpacken',alt:1,f:()=>{S.st.geluk+=12;S.geld-=3000;return 'Je reist een jaar door Zuidoost-Azië. Wat een ervaring!'}});
  queue({e:'🎓',t:'Wat ga je doen?',x:'Je hebt je diploma op zak. Hoe gaat het verder?',c});
}
function pickRicht(lvl,pt){
  const c=RL[lvl].map(r=>({l:RICHT[r],f:()=>startStudy(lvl,r,pt)}));
  c.push({l:'Toch niet',alt:1,f:()=>null});
  queue({e:'📚',t:`Studiekeuze ${edN(lvl)}`,x:'Welke richting kies je? Dit bepaalt in welke branches je kunt doorgroeien.',c});
}
function startStudy(lvl,r,pt){
  S.student={lvl,r,left:EDY[lvl]+(pt?1:0),naam:EDN[lvl],cijfer:6.5,yr:0,pt:!!pt};
  return `📚 Je begint ${pt?'in deeltijd ':''}aan ${RICHT[r].toLowerCase()} (${edN(lvl)}).${S.rijk>=2&&!pt?' Je ouders betalen je studie.':''}`;
}
function studyYear(){
  const s=S.student; s.left--; s.yr++;
  if(s.yr===1&&s.lvl>=3&&s.cijfer<5.5&&chance(.5)){log(`❌ Negatief bindend studieadvies: je moet stoppen met ${RICHT[s.r].toLowerCase()}.`,'bad big');S.student=null;S.st.geluk-=10;return}
  if(s.left>0){log(`📚 Studiejaar ${s.yr} afgerond met gemiddeld een ${fmtC(s.cijfer)}.`, s.cijfer>=5.5?'good':'bad');return}
  if(chance(Math.max(.1,Math.min(.97,(s.cijfer-4.3)/2.4)))){
    S.dips.push({lvl:s.lvl,r:s.r}); S.st.geluk+=12; S.student=null;
    log(`🎓 Diploma behaald: ${edN(s.lvl)} ${RICHT[s.r].toLowerCase()}!`,'good big');
  }else if(!s.extra){s.extra=1;s.left=1;log('Je hebt nog een extra jaar nodig om af te studeren.','bad');}
  else{log(`Je haalt je diploma niet en stopt met je studie.`,'bad big');S.student=null;S.st.geluk-=10;}
}

function randomEvent(){
  const pool=EVENTS.filter(e=>S.age>=e.min&&S.age<=e.max&&(!!e.jail)===(S.jail>0)&&(!e.if||e.if()));
  if(!pool.length) return;
  const e=pick(pool);
  queue({e:e.e,t:e.t,x:e.x,c:e.c,if:e.if});
}

/* ---------- modal queue ---------- */
const Q=[];
function queue(m){Q.push(m); if(!$('modalVeil').classList.contains('on')) nextModal();}
function nextModal(){
  const m=Q.shift(); if(!m){$('modalVeil').classList.remove('on');return}
  if(!S||!S.alive||(m.if&&!m.if())) return nextModal(); // situatie is intussen veranderd
  const el=$('modal'); el.innerHTML=`<div class="emoji">${m.e||''}</div><h2>${loc(m.t)}</h2><p>${loc(m.x)}</p>`;
  (m.c||[]).forEach(ch=>{const b=document.createElement('button');b.className='choice'+(ch.alt?' alt':'');b.innerHTML=loc(ch.l);b.disabled=!!ch.dis;
    b.onclick=()=>{let r=null; try{r=ch.f&&ch.f();}catch(err){console.warn(err);} if(r) log(r, ch.cls||''); for(const k in S.st)S.st[k]=clamp(S.st[k]); save(); render(); if(m.after&&$('sheetVeil').classList.contains('on')) m.after(); nextModal();};
    el.appendChild(b);});
  $('modalVeil').classList.add('on');
}

/* ---------- actions ---------- */
function useEnergy(){ return !!(S&&S.alive) } // geen limiet op acties
function doAct(fn){ if(!useEnergy()) return;
  const before={...S.st}; const r=fn(); closeSheet();
  // per kwartaal zijn acties kleiner: stat-effecten schalen mee
  for(const k in S.st){const d=S.st[k]-before[k]; if(d) S.st[k]=before[k]+Math.sign(d)*Math.max(1,Math.round(Math.abs(d)*.45));}
  if(r){log(r[0],r[1]||''); toast(r[0])} for(const k in S.st)S.st[k]=clamp(S.st[k]); save(); render(); }

function partnerGender(){const p=S.pref||'alle'; if(p==='m') return chance(.05)?'x':'m'; if(p==='v') return chance(.05)?'x':'v'; return chance(.12)?'x':pick(['m','v']);}
function isLhbti(){return S.trans||S.g==='x'||!((S.g==='m'&&S.pref==='v')||(S.g==='v'&&S.pref==='m'));}
function newPartner(where){
  const g=partnerGender(), p={n:nameFor(g),g,liefde:R(55,85),since:S.age,age:Math.max(16,S.age+R(-5,5)),inc:Math.round(R(18000,70000)*C().sf)};
  { const q=genProfileFor(g,p.age); Object.assign(p,{or:q.or,tr:q.tr,ints:q.ints,kids:q.kids,job:q.job}); }
  S.st.geluk+=8;
  if(S.partner&&S.poly){
    if(S.extra.length>=3) return 'Je hebt al vier partners. Je gedeelde agenda zit echt vol! 📅';
    S.extra.push(p); return `💞 Je hebt ${where} ${p.n} leren kennen. ${p.n} wordt je ${S.extra.length+1}e partner.`;
  }
  S.partner=p; return `💕 Je hebt ${where} ${p.n} leren kennen. Jullie hebben een relatie!`;
}

function applyJob(){
  if(S.age<15){toast('Je bent te jong om te werken.');return}
  const sm='style="font-weight:600;opacity:.8"';
  const c=Object.keys(BR).map(bk=>{const b=BR[bk], n=b.L.filter((_,i)=>req(bk,i).ok).length;
    return {l:`${b.ic} ${b.n}<br><small ${sm}>${n?`${n} functie${n>1?'s':''} voor jou`:'nog niets passends'}${S.bexp[bk]?` · ${S.bexp[bk]} jr ervaring`:''}</small>`,alt:!n,f:()=>{setTimeout(()=>applyBranch(bk),200);return null}}});
  c.push({l:'Toch maar niet',alt:1,f:()=>null});
  queue({e:'💼',t:'Vacatures',x:'In welke branche wil je werken? Elke branche heeft een eigen carrièreladder.',c});
}
function applyBranch(bk){

function doCrime(c){
  const a=S.age, gain=R(c.g[0],c.g[1]);
  if(chance(c.p)){
    S.record++; if(c.fame) S.fame=Math.min(100,S.fame+c.fame);
    if(c.sev===0){ S.st.geluk-=5; if(a<18) return [`🚨 Betrapt bij ${c.t.toLowerCase()}! Je krijgt een taakstraf.`,'bad']; S.geld-=500; return [`🚨 Betrapt bij ${c.t.toLowerCase()}! Boete: € 500.`,'bad'] }
    const y=a<18?1:R(c.j[0],c.j[1]); S.jail=y; if(S.job){S.lastSalary=S.job.s;S.job=null} S.student=null; S.st.geluk-=15;
    return [`🚔 Gearresteerd voor ${c.t.toLowerCase()}! ${a<18?'Je moet 1 jaar naar een jeugdinrichting.':`Je krijgt ${y} jaar cel.`}`,'bad big'];
  }
  S.crimes++; S.geld+=gain; if(c.happy) S.st.geluk+=c.happy; if(c.fame) S.fame=Math.min(100,S.fame+c.fame/2);
  return [gain?`🤫 ${c.t} gelukt. Buit: ${eur(gain)}.`:`🤫 ${c.t} gelukt. Niemand zag je.`];
}

function compat(p){

  if(p.tr.includes('grappig')) c+=5; if(p.tr.includes('dramatisch')) c-=5;
  const mine={sport:['fitness','voetbal','wielrennen','klimmen'],muziek:['muziek maken','festivals','dansen'],acteren:['kunst','series kijken'],wiskunde:['lezen','gamen'],ondernemen:['reizen','wijn proeven'],sociaal:['festivals','dansen','reizen']}[S.talent]||[];
  c+=p.ints.filter(x=>mine.includes(x)).length*8; if(S.vegan&&p.ints.includes('koken')) c+=4;

function continueAsPartner(p,net,prim){

function adultSetup(age){

function continueAsSib(x,net){

function continueAs(k,net){
  const old=S, inh=Math.max(0,Math.round(net/old.kids.length));
  newLife(k.n,k.g,old.sur,{country:old.country,nat:old.nat,city:old.city});
  S.gen=old.gen+1; S.age=k.age; S.log=[]; S.city=old.city; S.by=old.by+old.age-k.age;
  S.sibs=old.kids.filter(y=>y!==k).map(y=>({n:y.n,g:y.g,age:y.age,born:true,alive:true,band:R(50,85),kids:0,married:false}));
  S.parents=[{n:old.first,r:gWord(old.g,'vader','moeder','ouder'),age:old.age,alive:false}];

  if(k.age>=4&&k.age<12) S.school={niv:'basis',klas:k.age-3,cijfer:6.5,clubs:[],zit:0};

}

      ${sl('slimheid','🧠 Slimheid')}${sl('uiterlijk','✨ Uiterlijk')}${sl('gezondheid','❤️ Gezondheid')}${sl('geluk','😊 Geluk')}
      <button class="age" id="go" style="margin-top:14px">Geboren worden</button>
      <button class="choice alt" id="rnd" style="margin-top:10px">🎲 Alles willekeurig</button></div>`;
    app.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{const g=b.dataset.g,v=b.dataset.v;CFG[g]=g==='rijk'?+v:(g==='trans'||g==='poly')?v==='1':v;render()});
    app.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{CFG.st[r.dataset.k]=+r.value;$('v_'+r.dataset.k).textContent=r.value});
    $('nm').oninput=e=>CFG.first=e.target.value; $('sn').oninput=e=>CFG.sur=e.target.value; $('city').onchange=e=>CFG.city=e.target.value;
    $('cty').onchange=e=>{const k=e.target.value;if(CFG.nat===CFG.country)CFG.nat=k;CFG.country=k;CFG.city=pick(COUNTRIES[k].cities);const N=NAMES[CFG.nat];CFG.first=pick(nmList(CFG.g,CFG.nat));CFG.sur=pick(N.s);render()};
    $('nat').onchange=e=>{CFG.nat=e.target.value;const N=NAMES[CFG.nat];CFG.first=pick(nmList(CFG.g,CFG.nat));CFG.sur=pick(N.s);render()};
    $('rnd').onclick=()=>{rollCfg();render()};
    $('go').onclick=()=>{const c=CFG;newLife(c.first.trim()||pick(nmList(c.g,c.nat)),c.g,c.sur.trim()||pick(NAMES[c.nat].s),c);CFG=null;save();render()};
    return;
  }
  const st=S.st;
  const stats=[['😊','Geluk','geluk'],['❤️','Gezondheid','gezondheid'],['🧠','Slimheid','slimheid'],['✨','Uiterlijk','uiterlijk']]
    .map(([e,l,k])=>`<div class="stat"><div class="row"><span>${e} ${l}</span><span>${st[k]}%</span></div><div class="bar"><i style="width:${st[k]}%;background:${barColor(st[k])}"></i></div></div>`).join('');
  // log grouped
  let html='',cur=null;
  S.log.forEach(e=>{ if(e.a!==cur){ if(cur!==null) html+='</div>'; cur=e.a; html+=`<div class="yr"><h3>${e.a===0?'Geboorte':'Leeftijd '+e.a} · ${(S.by||2026)+e.a}</h3>`;} html+=`<p class="${e.c}">${e.t}</p>`; });
  if(cur!==null) html+='</div>';
  const dots=[...Array(EMAX).keys()].map(i=>`<i class="${i<S.energie?'':'off'}"></i>`).join('');
  app.innerHTML=`
   <div class="head"><div class="avatar">${avatar()}</div>
     <div class="who"><h1>${S.first} ${S.sur}</h1><div class="sub">${S.age} jaar · ${status()}${S.fame>=10?' · ⭐ '+S.fame:''}${S.gen>1?' · gen. '+S.gen:''}</div></div>
     <div class="money"><b class="${S.geld<0?'neg':''}">${eur(S.geld)}</b><span>${S.city}</span></div></div>
   <div class="stats">${stats}</div>
   <div class="log" id="log">${html}</div>
   <div class="bottom">
     <div class="tabs">
       <button class="tab" onclick="sheet('act')"><span>🎯</span>Doen</button>
       <button class="tab" onclick="sheet('werk')"><span>${S.age>=18&&!S.student?'💼':'🏫'}</span>${S.age>=18&&!S.student?'Werk':'School'}</button>
       <button class="tab" onclick="sheet('rel')"><span>❤️</span>Relaties</button>
       <button class="tab" onclick="sheet('bezit')"><span>🏠</span>Bezit</button>
       <button class="tab" onclick="sheet('meer')"><span>🎲</span>Avontuur</button>
     </div>
     ${S.alive?'<button class="age" id="ageBtn">＋ Volgend jaar</button>':'<button class="age" onclick="deathScreen()">🪦 Bekijk je levensloop</button>'}
   </div>`;
  const lg=$('log'); lg.scrollTop=lg.scrollHeight;
  const busy=()=>Q.length||$('modalVeil').classList.contains('on');
  const ab=$('ageBtn'); if(ab) ab.onclick=()=>{ if(!busy()) fastYear(); };
}

S=load();
render();
if(S&&!S.alive) deathScreen();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
